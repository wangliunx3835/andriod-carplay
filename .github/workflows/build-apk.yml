name: Build exact v2 source APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4
      - name: Verify and unpack complete v2 source ZIP
        run: |
          test -f AADisplay-CarPlay-network-fix-v2-source.zip
          echo "4a2edf69db969ba08823d90084059c93b6fa1585067f9ce0bad37f83583092db  AADisplay-CarPlay-network-fix-v2-source.zip" | sha256sum -c -
          mkdir source
          unzip -q AADisplay-CarPlay-network-fix-v2-source.zip -d source
          test -f source/gradlew
          test -f source/settings.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline.zip"
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :aa-display:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AADisplay-CarPlay-v2-exact-APK
          path: source/aa-display/build/outputs/apk/debug/*.apk
          if-no-files-found: error
