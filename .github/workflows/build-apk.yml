name: Build exact v2 source APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4
      - name: Fetch pinned AADisplay source
        run: |
          git clone --depth 1 --branch AADisplay-Split-Lite-Carplay https://github.com/lagXkjy/AADisplay.git source
          git -C source fetch --depth 1 origin 494dcc4909e8765e8798be4e7b8031fefd90a4eb
          git -C source checkout --detach 494dcc4909e8765e8798be4e7b8031fefd90a4eb
      - name: Apply exact v2 code changes and verify SHA256
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("aa-display/src/main/java/io/github/nitsuya/aa/display/carplay/CarPlaySourceSession.kt")
          s = p.read_text()
          old = '''            val addr = try {
              InetAddress.getByName(host)
            } catch (e: Throwable) {
              Log.e(CarPlayConsts.TAG, "StartSession resolve failed $host", e)
              return@Thread
            }
            // HU-stub / lab loopback: plain sockets, no accessory Network bind.
            val loopback = addr.isLoopbackAddress'''
          new = '''            // Do not resolve an unscoped fe80:: address before the Wi-Fi handoff
            // has settled. Android rejects link-local TCP without an interface scope.
            // Re-evaluate the DHCP gateway on each attempt because the initial
            // StartSession can arrive before LinkProperties become available.
            val linkLocal = host.startsWith("fe80:", ignoreCase = true)
            // HU-stub / lab loopback: plain sockets, no accessory Network bind.
            val loopback = !linkLocal && try {
                InetAddress.getByName(host).isLoopbackAddress
            } catch (_: Throwable) { false }'''
          old = old.replace('              ', '                ')
          if old not in s: raise SystemExit("v2 patch block 1 not found")
          s = s.replace(old,new,1)
          marker = '                    Log.i(\n                        CarPlayConsts.TAG,\n                        "AirPlay source dial from StartSession $host:$port " +'
          inject = '''                    val dialHost = if (linkLocal && !wired) {
                        wifiHandoff?.accessoryIpv4Hint(start.ssid ?: lastWifiSsid)
                    } else null
                    val effectiveHost = dialHost ?: host
                    val addr = InetAddress.getByName(effectiveHost)
                    if (linkLocal && dialHost == null) {
                        throw IllegalStateException(
                            "StartSession fe80 address lacks interface scope; " +
                                "waiting for accessory IPv4 DHCP gateway",
                        )
                    }
                    if (dialHost != null) {
                        Log.i(CarPlayConsts.TAG,
                            "AirPlay link-local fallback via DHCP gateway $dialHost")
                    }
'''
          if marker not in s: raise SystemExit("v2 patch block 2 not found")
          s=s.replace(marker,inject+marker.replace('$host:$port','$effectiveHost:$port'),1)
          marker='                    // Probe reachability before committing the AirPlay handshake thread.'
          s=s.replace(marker,'                    Log.i(CarPlayConsts.TAG, "AirPlay TCP probe target=$addr:$port networkBound=${CarPlayAccessoryNet.hasNetwork()} attempt=$attempt")\n'+marker,1)
          p.write_text(s)
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          expected='fe84b57bd87214d50aeb724b36aaf7eee0536c42ad62460938091c2d3240bbcc'
          print('Patched source SHA256:',digest)
          if digest != expected: raise SystemExit('v2 source checksum mismatch; refusing mislabeled build')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline.zip"
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :aa-display:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AADisplay-CarPlay-v2-verified-code-APK
          path: source/aa-display/build/outputs/apk/debug/*.apk
          if-no-files-found: error
