name: Build AADisplay v24 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream
        run: |
          git clone --depth 1 --branch AADisplay-Split-Lite-Carplay https://github.com/lagXkjy/AADisplay.git source
          git -C source fetch --depth 1 origin 494dcc4909e8765e8798be4e7b8031fefd90a4eb
          git -C source checkout --detach 494dcc4909e8765e8798be4e7b8031fefd90a4eb
      - name: Apply and verify exact v2 code
        working-directory: source
        run: python3 ../apply_v2.py
      - name: Apply v3 iAP2 fix
        working-directory: source
        run: python3 ../apply_v3.py
      - name: Apply v4 negotiated-session and TCP lifecycle fixes
        working-directory: source
        run: python3 ../apply_v4.py
      - name: Apply v5 IPv6 AirPlay endpoint fix
        working-directory: source
        run: python3 ../apply_v5.py
      - name: Apply v6 permission and AirPlay route diagnostics
        working-directory: source
        run: python3 ../apply_v6.py
      - name: Apply v7 preserve streaming on Bluetooth loss
        working-directory: source
        run: python3 ../apply_v7.py
      - name: Apply v8 wireless lock-screen stability fix
        working-directory: source
        run: python3 ../apply_v8.py
      - name: Apply v9 Linux screen SETUP compatibility and diagnostics
        working-directory: source
        run: python3 ../apply_v9.py
      - name: Apply v10 RTSP diagnostics
        working-directory: source
        run: python3 ../apply_v10.py
      - name: Apply v11 IPv4 and MIB3 session fixes
        working-directory: source
        run: python3 ../apply_v11.py
      - name: Apply v12 immediate video TCP dial
        working-directory: source
        run: python3 ../apply_v12.py
      - name: Apply v13 negotiated resolution and lifecycle diagnostics
        working-directory: source
        run: python3 ../apply_v13.py
      - name: Apply v14 RTSP recovery
        working-directory: source
        run: python3 ../apply_v14.py
      - name: Apply v15 Wi-Fi and CPU locks
        working-directory: source
        run: python3 ../apply_v15.py
      - name: Apply v16 virtual-display IME fix
        working-directory: source
        run: python3 ../apply_v16.py
      - name: Apply v17 IME-only recovery and diagnostics
        working-directory: source
        run: python3 ../apply_v17.py
      - name: Apply v18 IME geometry diagnostics
        working-directory: source
        run: python3 ../apply_v18.py
      - name: Apply v19 conditional IME layout recovery
        working-directory: source
        run: python3 ../apply_v19.py
      - name: Apply v20 IME focus diagnostics and policy repair
        working-directory: source
        run: python3 ../apply_v20.py
      - name: Apply v21 native Android IME routing
        working-directory: source
        run: python3 ../apply_v21.py
      - name: Apply v22 original author IME display hooks
        working-directory: source
        run: python3 ../apply_v22.py
      - name: Apply v23-A safe IPv4 gateway readiness optimization
        working-directory: source
        run: python3 ../apply_v23.py
      - name: Apply v24 IME-only verification and diagnostics
        working-directory: source
        run: python3 ../apply_v24.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline.zip"
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :aa-display:assembleDebug --stacktrace
      - name: Build optimized release APK (experimental size comparison)
        working-directory: source
        run: ./gradlew :aa-display:assembleRelease --stacktrace
      - name: APK size comparison
        run: |
          du -h source/aa-display/build/outputs/apk/debug/*.apk source/aa-display/build/outputs/apk/release/*.apk
          unzip -l source/aa-display/build/outputs/apk/debug/*.apk | tail -n 2
      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(find source/aa-display/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -n "$apk"
          cp "$apk" AADisplay-CarPlay-v24-debug.apk
          optimized=$(find source/aa-display/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -n "$optimized"
          cp "$optimized" AADisplay-CarPlay-v24-optimized-experimental.apk
          tag="v24-ime-single-display-policy"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" AADisplay-CarPlay-v24-debug.apk AADisplay-CarPlay-v24-optimized-experimental.apk --clobber
          else
            gh release create "$tag" AADisplay-CarPlay-v24-debug.apk AADisplay-CarPlay-v24-optimized-experimental.apk --target "$GITHUB_SHA" --title "AADisplay CarPlay v24 IME Verification" --notes "v24 preserves v23 wireless IPv4 readiness optimization and original IME display routing. Verifies hard-keyboard soft IME setting write/readback and logs virtual display IME window frame/visibility. No CarPlay transport, video, touch, display geometry or IME forced-show changes. Experimental optimized APK may affect hooks." --latest
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AADisplay-CarPlay-v24-APK
          path: |
            source/aa-display/build/outputs/apk/debug/*.apk
            source/aa-display/build/outputs/apk/release/*.apk
          if-no-files-found: error
