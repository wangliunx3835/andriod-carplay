name: Build AADisplay v2 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4
      - name: Fetch AADisplay source
        run: |
          git clone --depth 1 --branch AADisplay-Split-Lite-Carplay https://github.com/lagXkjy/AADisplay.git source
          git -C source fetch --depth 1 origin 494dcc4909e8765e8798be4e7b8031fefd90a4eb
          git -C source checkout --detach 494dcc4909e8765e8798be4e7b8031fefd90a4eb
      - name: Apply CarPlay TCP diagnostic patch
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("aa-display/src/main/java/io/github/nitsuya/aa/display/carplay/CarPlaySourceSession.kt")
          s = p.read_text()
          marker = '                    // Probe reachability before committing the AirPlay handshake thread.'
          insert = '                    Log.i(CarPlayConsts.TAG, "AirPlay TCP probe target=$addr:$port networkBound=${CarPlayAccessoryNet.hasNetwork()} attempt=$attempt")\n'
          if marker not in s:
              raise SystemExit("Patch location not found; upstream changed")
          if insert.strip() not in s:
              p.write_text(s.replace(marker, insert + marker, 1))
          PY
      - name: Verify v2 source file checksum
        working-directory: source
        run: |
          echo "fe84b57bd87214d50aeb724b36aaf7eee0536c42ad62460938091c2d3240bbcc  aa-display/src/main/java/io/github/nitsuya/aa/display/carplay/CarPlaySourceSession.kt" | sha256sum -c -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline.zip"
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$RUNNER_TEMP/android-sdk/cmdline-tools"
          mv "$RUNNER_TEMP/android-sdk/cmdline-tools/cmdline-tools" "$RUNNER_TEMP/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :aa-display:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AADisplay-CarPlay-v2-verified-APK
          path: source/aa-display/build/outputs/apk/debug/*.apk
          if-no-files-found: error
